<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>治療室點班單</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 螢幕顯示模式：隱藏列印區 */
    @media screen {
      #print-area { display: none; }
    }
    
    /* 成功特效動畫 */
    @keyframes highlightFade {
      0% { background-color: #c7d2fe; } 
      100% { background-color: transparent; }
    }
    .highlight-row {
      animation: highlightFade 1.2s ease-out forwards;
    }
    
    /* ==================================================
       列印模式：終極物理尺寸暴力鎖死法 (每一頁皆完全相同)
       ================================================== */
    @media print {
      html, body { background-color: white; padding: 0; margin: 0; }
      #ui-area { display: none !important; }
      #print-area { display: block; width: 100%; margin: 0; padding: 0; }
      
      /* ✨ 1. 徹底封殺 Chrome 預設邊界與頁首/頁尾 ✨ */
      @page { size: A4; margin: 0mm !important; } 
      
      /* ✨ 2. 實體 A4 畫布：210mm x 297mm 絕對鎖死 ✨ */
      .print-page {
        width: 210mm !important;
        height: 297mm !important; 
        max-height: 297mm !important;
        box-sizing: border-box !important;
        /* ✨ 3. 統一邊界：上下 1cm，左右 2cm ✨ */
        padding: 10mm 20mm !important;
        position: relative;
        page-break-after: always;
        page-break-inside: avoid;
        overflow: hidden; 
        
        /* ✨ 4. 絕對置中霸王條款：強迫內容水平垂直置中 ✨ */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .print-page.last-page {
        page-break-after: auto; 
      }

      /* ✨ 5. 淡淡灰色的打洞三角形 (畫在左側 20mm 留白區內) ✨ */
      .punch-mark {
        position: absolute;
        top: 50%; 
        transform: translateY(-50%);
        left: 8mm; 
        width: 0; 
        height: 0;
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-right: 12px solid #cbd5e1; /* 淡灰色 */
        z-index: 10;
      }
      
      /* ✨ 6. 表格強制尺寸：自動撐滿扣掉白邊後的剩餘空間 ✨ 
         寬度：210 - 左20 - 右20 = 170mm
         高度：297 - 上10 - 下10 = 277mm 
      */
      .print-table { 
        width: 100% !important; 
        height: 100% !important; 
        max-width: 170mm !important;
        max-height: 277mm !important;
        border-collapse: collapse; 
        table-layout: fixed; 
        font-size: 12pt; 
      }
      
      .print-table th, .print-table td { 
        border: 1px solid black; 
        text-align: center; 
        padding: 1px; 
      }
      
      .print-table th { background-color: #f9fafb; font-weight: normal; }
      .print-table thead th { height: 35px; }
      .category-title { height: 35px; }
      
      .col-grid { width: 8%; }
      .col-name { width: 18%; }
      .col-qty { width: 10%; }
      
      .signature-row td { height: 60px !important; vertical-align: middle; padding-bottom: 0;}
    }
  </style>
</head>
<body class="bg-gray-100 p-4">

  <!-- ================= 系統操作介面區 ================= -->
  <div id="ui-area" class="max-w-xl mx-auto bg-white p-5 rounded-lg shadow-md">
    
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-bold text-gray-800">治療室點班單列印</h1>
    </div>
    
    <div class="flex items-end gap-4 mb-5 bg-gray-50 p-3 rounded border">
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-bold text-gray-500 leading-none">起始日期 (週一)</label>
        <input type="date" id="start-date" onchange="checkMonday()" class="border border-gray-300 px-2 rounded h-8 w-32 text-xs transition">
      </div>
      
      <div class="flex flex-col gap-1.5 ml-1">
        <label class="text-[11px] font-bold text-gray-500 leading-none">列印週數</label>
        <div class="flex gap-1" id="week-pills">
          <button onclick="setWeeks(2)" class="week-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-3 h-8 rounded text-xs font-medium transition flex items-center justify-center">2週</button>
          <button onclick="setWeeks(4)" class="week-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-3 h-8 rounded text-xs font-medium transition flex items-center justify-center">4週</button>
          <button onclick="setWeeks(6)" class="week-btn bg-blue-600 text-white px-3 h-8 rounded text-xs font-medium transition flex items-center justify-center shadow-sm" data-active="true">6週</button>
          <button onclick="setWeeks(8)" class="week-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-3 h-8 rounded text-xs font-medium transition flex items-center justify-center">8週</button>
        </div>
      </div>

      <div class="ml-auto flex gap-2">
        <button onclick="generatePrint()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 h-8 rounded transition shadow text-xs">列印</button>
      </div>
    </div>

    <div class="flex items-center gap-2 mb-3 select-none">
      <span id="editor-toggle-icon" class="text-gray-400 transform transition-transform duration-200 text-sm cursor-pointer" onclick="toggleEditor()">▶</span>
      <h2 class="text-lg font-bold text-gray-800 cursor-pointer" onclick="toggleEditor()">品項編輯區</h2>
      
      <div class="ml-auto">
        <button id="refresh-btn" onclick="loadData()" class="w-7 h-7 flex items-center justify-center bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-full transition shadow-sm" title="重新載入/同步">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
      </div>
    </div>

    <!-- 編輯區容器 (預設隱藏) -->
    <div id="editor-content" class="hidden">
      <div class="overflow-x-auto pb-4">
        <table class="w-full border-collapse border border-gray-300 text-xs">
          <thead class="bg-gray-200">
            <tr>
              <th class="border p-1 w-14">類別</th>
              <th class="border p-1 w-10">編號</th>
              <th class="border p-1 w-24">品項名稱</th>
              <th class="border p-1 w-12">數量</th>
              <th class="border p-1 w-32">操作</th>
            </tr>
          </thead>
          <tbody id="editor-tbody">
            <!-- 資料由 JS 動態產生 -->
          </tbody>
          <tfoot class="bg-gray-100 border-t-2 border-gray-300">
            <tr>
              <td class="border p-1">
                <select id="new-cat" onchange="handleCatChange()" class="w-full p-1 border rounded text-center text-xs font-bold text-gray-700">
                  <option value="器械">器械</option>
                  <option value="其他品項">其他品項</option>
                </select>
              </td>
              <td class="border p-1">
                <input type="text" id="new-grid" class="w-full p-1 border rounded text-center font-bold text-blue-600 text-xs" placeholder="1">
              </td>
              <td class="border p-1">
                <input type="text" id="new-name" class="w-full p-1 border rounded text-xs" placeholder="名稱">
              </td>
              <td class="border p-1">
                <input type="number" id="new-qty" class="w-full p-1 border rounded text-center text-xs" placeholder="數量">
              </td>
              <td class="border p-1">
                <div class="flex justify-center items-center gap-1">
                  <button id="btn-add" onclick="addItem(this)" class="bg-blue-600 text-white flex-1 py-1 rounded hover:bg-blue-700 transition shadow-sm font-bold text-xs whitespace-nowrap">新增</button>
                  <button id="btn-sort" onclick="autoSort(this)" class="bg-blue-50 text-blue-600 hover:bg-blue-100 border border-blue-200 font-bold flex-1 py-1 rounded transition shadow-sm whitespace-nowrap text-xs" title="排序">排序</button>
                </div>
              </td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <!-- ================= 列印隱藏區 ================= -->
  <div id="print-area"></div>

  <!-- ================= 核心邏輯 ================= -->
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzwGKX1VXJY1EaWulhxdKUB-NUnIR1oSJwHa2xQFezah8-QkpUABkOIWpq6xsx4Tic_/exec';
    let items = [];
    let selectedWeeks = 6; 
    let editingIndex = -1;
    let highlightIndex = -1; 

    function initDate() {
      const d = new Date();
      const day = d.getDay() || 7; 
      d.setDate(d.getDate() - day + 1); 
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      document.getElementById('start-date').value = `${yyyy}-${mm}-${dd}`;
    }

    function checkMonday() {
      const input = document.getElementById('start-date');
      if (!input.value) return;
      let d = new Date(input.value);
      if (d.getDay() !== 1) {
        alert("起始日期必須是星期一！系統已自動為您校正。");
        d.setDate(d.getDate() - (d.getDay() || 7) + 1); 
        input.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
    }

    function setWeeks(weeks) {
      selectedWeeks = weeks;
      document.querySelectorAll('.week-btn').forEach(btn => {
        if (btn.innerText.includes(weeks)) {
          btn.className = "week-btn bg-blue-600 text-white px-3 h-8 rounded text-xs font-medium transition flex items-center justify-center shadow-sm";
        } else {
          btn.className = "week-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-3 h-8 rounded text-xs font-medium transition flex items-center justify-center";
        }
      });
    }

    function toggleEditor() {
      const content = document.getElementById('editor-content');
      const icon = document.getElementById('editor-toggle-icon');
      if(content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        icon.style.transform = 'rotate(90deg)';
      } else {
        content.classList.add('hidden');
        icon.style.transform = 'rotate(0deg)';
      }
    }

    function handleCatChange() {
      const cat = document.getElementById('new-cat').value;
      const gridInp = document.getElementById('new-grid');
      if(cat === '其他品項') {
        gridInp.value = '';
        gridInp.disabled = true;
        gridInp.classList.add('bg-gray-200');
        gridInp.placeholder = '-';
      } else {
        gridInp.disabled = false;
        gridInp.classList.remove('bg-gray-200');
        gridInp.placeholder = '1';
        let maxGrid = 0;
        items.filter(i => i['類別'] === '器械').forEach(i => {
          let g = parseInt(i['編號']);
          if(!isNaN(g) && g > maxGrid) maxGrid = g;
        });
        gridInp.value = maxGrid + 1;
      }
    }

    function setSpinning(isSpinning) {
      const btn = document.getElementById('refresh-btn');
      if (!btn) return;
      const svg = btn.querySelector('svg');
      if (svg) {
        if (isSpinning) svg.classList.add('animate-spin');
        else svg.classList.remove('animate-spin');
      }
    }

    async function loadData() {
      setSpinning(true);
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        items = data.map(item => {
          if(item['類別'] === '其他') item['類別'] = '其他品項';
          let val = item['編號'] !== undefined ? item['編號'] : (item['格子編號'] || '');
          item['編號'] = val;
          item['格子編號'] = val;
          return item;
        });
        doLocalSort(); 
        editingIndex = -1; highlightIndex = -1;
        renderEditor(); handleCatChange(); 
      } catch (error) {
        console.error(error); alert("載入失敗");
      } finally {
        setSpinning(false);
      }
    }

    async function saveData() {
      setSpinning(true);
      items.forEach((item, index) => item['排序'] = index + 1);
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(items)
        });
      } catch (error) {
        console.error(error); alert("同步失敗");
      } finally {
        setSpinning(false);
      }
    }

    async function moveItem(index, direction) {
      if (index + direction < 0 || index + direction >= items.length) return;
      
      const tr = document.getElementById(`row-${index}`);
      if(tr) tr.className = 'bg-indigo-200 transition-colors duration-300';

      const sourceItem = items[index];
      const targetItem = items[index + direction];
      
      if (sourceItem['類別'] !== targetItem['類別']) {
         renderEditor(); 
         return; 
      }

      const sourceGrid = sourceItem['編號'] || '';
      const targetGrid = targetItem['編號'] || '';

      if (sourceGrid === targetGrid) {
        [items[index], items[index + direction]] = [items[index + direction], items[index]];
      } else {
        if (sourceGrid !== '' && targetGrid !== '') {
            items.forEach(item => {
              if (item['類別'] === sourceItem['類別']) {
                if (String(item['編號']) === String(sourceGrid)) {
                  item['編號'] = targetGrid;
                  item['格子編號'] = targetGrid;
                } else if (String(item['編號']) === String(targetGrid)) {
                  item['編號'] = sourceGrid;
                  item['格子編號'] = sourceGrid;
                }
              }
            });
        } else {
            [items[index], items[index + direction]] = [items[index + direction], items[index]];
        }
      }

      items.forEach((item, idx) => item['排序'] = idx + 1);
      doLocalSort(); 
      
      const newIndex = items.indexOf(sourceItem);
      saveData(); 
      
      highlightIndex = newIndex; 
      renderEditor(); 
    }

    function doLocalSort() {
      items.sort((a, b) => {
        if (a['類別'] !== b['類別']) return a['類別'] === '器械' ? -1 : 1;
        const numA = parseInt(a['編號'], 10);
        const numB = parseInt(b['編號'], 10);
        const isNaNA = isNaN(numA); const isNaNB = isNaN(numB);
        
        if (isNaNA && isNaNB) return (a['排序'] || 0) - (b['排序'] || 0);
        if (isNaNA) return 1;
        if (isNaNB) return -1;
        if (numA !== numB) return numA - numB;
        return (a['排序'] || 0) - (b['排序'] || 0);
      });
    }

    async function autoSort(btn) {
      btn.innerHTML = '處理中...'; btn.disabled = true;
      doLocalSort();
      await saveData();
      highlightIndex = -1; 
      btn.innerHTML = '排序'; btn.disabled = false;
      renderEditor();
    }

    async function addItem(btn) {
      const cat = document.getElementById('new-cat').value;
      const grid = document.getElementById('new-grid').value;
      const name = document.getElementById('new-name').value;
      const qty = document.getElementById('new-qty').value;
      
      if(!name) return alert('請輸入品項名稱');
      
      btn.innerHTML = '處理中...'; btn.disabled = true;
      
      const newItem = {
        '類別': cat, '排序': items.length + 1, 
        '編號': grid, '格子編號': grid, 
        '品項': name, '數量': qty
      };
      items.push(newItem);
      
      items.forEach((item, idx) => item['排序'] = idx + 1);
      doLocalSort();
      
      await saveData();

      highlightIndex = items.indexOf(newItem); 
      document.getElementById('new-name').value = '';
      document.getElementById('new-qty').value = '';
      
      btn.innerHTML = '新增'; btn.disabled = false;
      renderEditor(); handleCatChange();
    }

    async function deleteItem(index) { 
      if(confirm('確定要刪除此品項嗎？')) {
        const tr = document.getElementById(`row-${index}`);
        if(tr) tr.className = 'bg-red-100 opacity-50 transition-all duration-300'; 
        items.splice(index, 1); 
        await saveData(); 
        renderEditor(); 
      }
    }

    function renderEditor() {
      const tbody = document.getElementById('editor-tbody');
      tbody.innerHTML = '';
      
      let prevCat = null;
      let prevGrid = null;

      items.forEach((item, index) => {
        const currentGrid = item['編號'] || '';
        const currentCat = item['類別'];
        
        const isSameGroup = (currentCat === prevCat && currentGrid === prevGrid && currentGrid !== '');
        const displayGrid = isSameGroup ? '' : currentGrid;

        const tr = document.createElement('tr');
        tr.id = `row-${index}`;
        
        const isHighlight = (highlightIndex === index);
        
        if (editingIndex === index) {
          tr.className = "bg-yellow-50";
          tr.innerHTML = `
            <td class="border p-1">
              <select id="edit-cat-${index}" class="w-full p-1 border rounded text-center text-xs">
                <option value="器械" ${item['類別']==='器械'?'selected':''}>器械</option>
                <option value="其他品項" ${item['類別']==='其他品項'?'selected':''}>其他品項</option>
              </select>
            </td>
            <td class="border p-1"><input type="text" id="edit-grid-${index}" value="${currentGrid}" class="w-full text-center p-1 border rounded text-xs"></td>
            <td class="border p-1"><input type="text" id="edit-name-${index}" value="${item['品項']}" class="w-full p-1 border rounded text-xs"></td>
            <td class="border p-1"><input type="number" id="edit-qty-${index}" value="${item['數量']}" class="w-full text-center p-1 border rounded text-xs"></td>
            <td class="border p-1">
              <div class="flex justify-center items-center gap-1">
                <button onclick="saveEdit(${index}, this)" class="bg-blue-600 text-white flex-1 py-1 rounded hover:bg-blue-700 shadow-sm text-xs font-bold whitespace-nowrap transition">儲存</button>
                <button onclick="cancelEdit()" class="bg-gray-400 text-white flex-1 py-1 rounded hover:bg-gray-500 shadow-sm text-xs whitespace-nowrap transition">取消</button>
              </div>
            </td>
          `;
        } else {
          tr.className = isHighlight ? "highlight-row" : "hover:bg-gray-50 transition-colors duration-200";
          tr.innerHTML = `
            <td class="border p-1 text-center text-gray-700 text-xs">${currentCat}</td>
            <td class="border p-1 text-center font-bold text-blue-600 text-sm">${displayGrid}</td>
            <td class="border p-1 text-xs truncate max-w-[120px]">${item['品項']}</td>
            <td class="border p-1 text-center font-bold text-xs">${item['數量']}</td>
            <td class="border p-1">
              <div class="flex justify-center items-center gap-1.5">
                <button onclick="moveItem(${index}, -1)" class="bg-gray-200 text-black hover:bg-gray-300 w-6 h-6 rounded flex items-center justify-center transition" title="上移">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>
                </button>
                <button onclick="moveItem(${index}, 1)" class="bg-gray-200 text-black hover:bg-gray-300 w-6 h-6 rounded flex items-center justify-center transition" title="下移">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" /></svg>
                </button>
                <button onclick="enableEdit(${index})" class="text-blue-600 hover:text-blue-800 transition p-1" title="編輯">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                </button>
                <button onclick="deleteItem(${index})" class="text-red-500 hover:text-red-700 transition p-1" title="刪除">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </td>
          `;
        }
        tbody.appendChild(tr);
        
        prevCat = currentCat;
        prevGrid = currentGrid;
      });
    }

    function enableEdit(index) { editingIndex = index; renderEditor(); }
    function cancelEdit() { editingIndex = -1; renderEditor(); }
    
    async function saveEdit(index, btn) {
      btn.innerHTML = '處理中...'; btn.disabled = true;
      items[index]['類別'] = document.getElementById(`edit-cat-${index}`).value;
      const newGrid = document.getElementById(`edit-grid-${index}`).value;
      items[index]['編號'] = newGrid; items[index]['格子編號'] = newGrid;
      items[index]['品項'] = document.getElementById(`edit-name-${index}`).value;
      items[index]['數量'] = document.getElementById(`edit-qty-${index}`).value;
      
      await saveData();
      editingIndex = -1; highlightIndex = index; 
      renderEditor();
    }

    function generatePrint() {
      const startDateInput = document.getElementById('start-date').value;
      if(!startDateInput) return alert('請先選擇起始日期');
      
      let d = new Date(startDateInput);
      const day = d.getDay() || 7; 
      d.setDate(d.getDate() - day + 1); 

      const printArea = document.getElementById('print-area');
      printArea.innerHTML = '';

      for(let w = 0; w < selectedWeeks; w++) {
        const weekStart = new Date(d);
        weekStart.setDate(weekStart.getDate() + (w * 7));
        
        let dates = [];
        for(let i = 0; i < 5; i++) {
           let cur = new Date(weekStart);
           cur.setDate(cur.getDate() + i);
           dates.push(`${cur.getMonth() + 1}/${cur.getDate()}`);
        }

        const page = document.createElement('div');
        page.className = 'print-page';
        
        if (w === selectedWeeks - 1) {
          page.classList.add('last-page');
        }
        
        // ✨ 每一頁都產生打洞標記，因為現在每一頁都完全一模一樣 ✨
        const punchHole = document.createElement('div');
        punchHole.className = 'punch-mark';
        page.appendChild(punchHole);
        
        let tableHTML = `
          <table class="print-table">
            <colgroup>
              <col class="col-grid">
              <col class="col-name">
              <col class="col-qty">
              <col span="5" style="width:12.4%;">
            </colgroup>
            <thead>
              <tr>
                <th colspan="2" rowspan="2" style="font-size: 14pt;">項目</th>
                <th>日期</th>
                <th>${dates[0]}</th><th>${dates[1]}</th><th>${dates[2]}</th><th>${dates[3]}</th><th>${dates[4]}</th>
              </tr>
              <tr>
                <th>數量</th>
                <th>星期一</th><th>星期二</th><th>星期三</th><th>星期四</th><th>星期五</th>
              </tr>
            </thead>
            <tbody>
        `;

        const instruments = items.filter(i => i['類別'] === '器械');
        tableHTML += `<tr><td colspan="8" class="category-title" style="font-size: 13pt; letter-spacing: 1em;">器械</td></tr>`;
        
        let currentGrid = null;
        let gridSpan = 0;
        
        instruments.forEach((item, idx) => {
           let gridNum = item['編號'] || '';
           tableHTML += `<tr>`;
           
           if(gridNum !== currentGrid || gridNum === "") {
             gridSpan = instruments.filter(i => (i['編號'] || '') === gridNum && gridNum !== "").length;
             if(gridSpan === 0) gridSpan = 1;
             tableHTML += `<td rowspan="${gridSpan}">${gridNum}</td>`;
             currentGrid = gridNum;
           }
           
           tableHTML += `<td style="text-align: left; padding-left: 10px;">${item['品項']}</td>
                         <td>${item['數量']}</td>
                         <td></td><td></td><td></td><td></td><td></td></tr>`;
        });

        const others = items.filter(i => i['類別'] === '其他品項' || i['類別'] === '其他');
        tableHTML += `<tr><td colspan="8" class="category-title" style="font-size: 13pt; letter-spacing: 1em;">其他品項</td></tr>`;
        
        others.forEach(item => {
           tableHTML += `<tr>
                          <td colspan="2" style="text-align: left; padding-left: 10px;">${item['品項']}</td>
                          <td>${item['數量']}</td>
                          <td></td><td></td><td></td><td></td><td></td>
                         </tr>`;
        });

        tableHTML += `
            <tr class="signature-row">
              <td colspan="3" style="font-size: 16pt; letter-spacing: 1em;">簽名</td>
              <td></td><td></td><td></td><td></td><td></td>
            </tr>
            </tbody>
          </table>
        `;
        page.innerHTML += tableHTML;
        printArea.appendChild(page);
      }

      setTimeout(() => { window.print(); }, 300);
    }

    window.onload = function() {
      initDate();
      loadData();
    };
  </script>
</body>
</html>
