<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>治療室點班單</title>
  
  <!-- 桌面與手機 Logo 設定 -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 螢幕顯示模式：隱藏列印區 */
    @media screen {
      #print-area { display: none; }
    }
    
    /* 列印模式 */
    @media print {
      body { background-color: white; padding: 0; margin: 0; }
      #ui-area { display: none !important; }
      #print-area { display: block; width: 100%; }
      
      /* 1. 強制消除瀏覽器預設的邊界與頁首/頁尾 (網址、日期) */
      @page { size: A4; margin: 0; } 
      
      /* 2. 建立完美的實體 A4 頁面容器 */
      .print-page {
        width: 210mm;
        height: 296mm; /* 稍微扣除 1mm 避免溢出到下一頁 */
        padding: 15mm 20mm; /* 實際的留白：上下 1.5cm，左右 2cm (裝訂用) */
        box-sizing: border-box;
        position: relative; /* 讓小橫槓以此為基準定位 */
        page-break-after: always;
        page-break-inside: avoid;
        background-color: white;
      }
      .print-page:last-child {
        page-break-after: auto; 
      }

      /* 3. ✨ 精準的打洞器對齊小橫線 ✨ */
      .print-page::before {
        content: '';
        position: absolute;
        left: 5mm; /* 距離紙張最左側物理邊緣 0.5 公分處開始 */
        top: 50%; /* 絕對垂直置中！保證在紙張一半的位置 */
        width: 10mm; /* 橫線長度 1 公分 */
        border-top: 1.5px solid black; /* 線條清晰可見 */
      }
      
      /* 4. 表格設定：高度 100% 自動填滿內縮後的可用空間 */
      .print-table { 
        width: 100%; 
        height: 100%; 
        border-collapse: collapse; 
        table-layout: fixed; 
        font-size: 12pt; 
      }
      
      .print-table th, .print-table td { 
        border: 1px solid black; 
        text-align: center; 
        padding: 1px; /* 壓縮內部間距，確保多項目時也塞得下 */
      }
      
      .print-table th { background-color: #f9fafb; font-weight: normal; }
      .print-table thead th { height: 35px; }
      .category-title { height: 35px; }
      
      .col-grid { width: 8%; }
      .col-name { width: 22%; }
      .col-qty { width: 8%; }
      
      .signature-row td { height: 45px; vertical-align: bottom; padding-bottom: 5px;}
    }
  </style>
</head>
<body class="bg-gray-100 p-6">

  <!-- ================= 操作介面區 ================= -->
  <div id="ui-area" class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
    
    <div class="flex items-center gap-4 mb-6">
      <h1 class="text-3xl font-bold text-gray-800">治療室點班單系統</h1>
      <span id="status-msg" class="text-sm font-medium text-gray-600 bg-gray-100 px-3 py-1 rounded-full border">讀取中...</span>
    </div>
    
    <div class="flex flex-wrap gap-6 items-end mb-8 bg-gray-50 p-5 rounded border">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-gray-700 leading-none">起始日期 (週一)</label>
        <input type="date" id="start-date" onchange="checkMonday()" class="border border-gray-300 px-3 rounded h-[38px] w-40 box-border text-sm">
      </div>
      
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-gray-700 leading-none">列印週數</label>
        <div class="flex gap-2 items-center h-[38px]" id="week-pills">
          <button onclick="setWeeks(2)" class="week-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 h-[30px] rounded-full text-sm font-medium transition flex items-center justify-center">2週</button>
          <button onclick="setWeeks(4)" class="week-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 h-[30px] rounded-full text-sm font-medium transition flex items-center justify-center">4週</button>
          <button onclick="setWeeks(6)" class="week-btn bg-blue-600 text-white px-4 h-[30px] rounded-full text-sm font-medium transition flex items-center justify-center shadow-sm" data-active="true">6週</button>
          <button onclick="setWeeks(8)" class="week-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 h-[30px] rounded-full text-sm font-medium transition flex items-center justify-center">8週</button>
        </div>
      </div>

      <div class="ml-auto flex gap-3">
        <button onclick="loadData()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold px-4 h-[38px] rounded transition shadow text-sm">
          重新載入
        </button>
        <button onclick="generatePrint()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 h-[38px] rounded transition shadow text-sm">
          列印
        </button>
      </div>
    </div>

    <div class="flex justify-between items-end mb-4">
      <h2 class="text-xl font-bold text-gray-800">資料編輯區</h2>
      <button onclick="autoSort()" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 font-bold px-4 py-1.5 rounded text-sm transition shadow-sm">
        ✨ 排序
      </button>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full border-collapse border border-gray-300 text-sm">
        <thead class="bg-gray-200">
          <tr>
            <th class="border p-2 w-20">類別</th>
            <th class="border p-2 w-20">編號</th>
            <th class="border p-2">品項名稱</th>
            <th class="border p-2 w-20">數量</th>
            <th class="border p-2 w-48">操作</th>
          </tr>
        </thead>
        <tbody id="editor-tbody">
          <!-- 資料由 JS 動態產生 -->
        </tbody>
        <tfoot class="bg-gray-100">
          <tr>
            <td class="border p-1">
              <select id="new-cat" class="w-full p-2 border rounded text-center"><option>器械</option><option>其他</option></select>
            </td>
            <td class="border p-1">
              <input type="text" id="new-grid" class="w-full p-2 border rounded text-center" placeholder="如: 1">
            </td>
            <td class="border p-1">
              <input type="text" id="new-name" class="w-full p-2 border rounded" placeholder="輸入品項名稱">
            </td>
            <td class="border p-1">
              <input type="number" id="new-qty" class="w-full p-2 border rounded text-center" placeholder="數量">
            </td>
            <td class="border p-1 text-center">
              <button onclick="addItem()" class="bg-indigo-500 text-white px-6 py-2 rounded hover:bg-indigo-600 transition shadow-sm font-bold w-full">新增</button>
            </td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <!-- ================= 列印隱藏區 ================= -->
  <div id="print-area"></div>

  <!-- ================= 核心邏輯 ================= -->
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzwGKX1VXJY1EaWulhxdKUB-NUnIR1oSJwHa2xQFezah8-QkpUABkOIWpq6xsx4Tic_/exec';
    let items = [];
    let selectedWeeks = 6; 
    let editingIndex = -1;

    function initDate() {
      const d = new Date();
      const day = d.getDay() || 7; 
      d.setDate(d.getDate() - day + 1); 
      
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      document.getElementById('start-date').value = `${yyyy}-${mm}-${dd}`;
    }

    function checkMonday() {
      const input = document.getElementById('start-date');
      if (!input.value) return;
      
      let d = new Date(input.value);
      const day = d.getDay();
      
      if (day !== 1) {
        alert("起始日期必須是星期一！系統已自動為您校正。");
        const dayCalc = day || 7; 
        d.setDate(d.getDate() - dayCalc + 1); 
        
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        input.value = `${yyyy}-${mm}-${dd}`;
      }
    }

    function setWeeks(weeks) {
      selectedWeeks = weeks;
      const btns = document.querySelectorAll('.week-btn');
      btns.forEach(btn => {
        if (btn.innerText.includes(weeks)) {
          btn.className = "week-btn bg-blue-600 text-white px-4 h-[30px] rounded-full text-sm font-medium transition flex items-center justify-center shadow-sm";
        } else {
          btn.className = "week-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 h-[30px] rounded-full text-sm font-medium transition flex items-center justify-center";
        }
      });
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById('status-msg');
      el.innerText = msg;
      if(isError) {
        el.className = "text-sm font-medium text-red-600 bg-red-50 px-3 py-1 rounded-full border border-red-200";
      } else if (msg === '已同步') {
        el.className = "text-sm font-medium text-green-700 bg-green-50 px-3 py-1 rounded-full border border-green-200";
      } else {
        el.className = "text-sm font-medium text-blue-600 bg-blue-50 px-3 py-1 rounded-full border border-blue-200";
      }
    }

    async function loadData() {
      setStatus("讀取中...");
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        items = data.map(item => {
          let val = item['編號'] !== undefined ? item['編號'] : (item['格子編號'] || '');
          item['編號'] = val;
          item['格子編號'] = val;
          return item;
        }).sort((a, b) => parseInt(a['排序'] || 0) - parseInt(b['排序'] || 0));
        
        editingIndex = -1;
        renderEditor();
        setStatus("已同步");
      } catch (error) {
        console.error(error);
        setStatus("同步失敗", true);
      }
    }

    async function saveData() {
      setStatus("儲存中...");
      items.forEach((item, index) => item['排序'] = index + 1);
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(items)
        });
        setStatus("已同步");
        renderEditor();
      } catch (error) {
        console.error(error);
        setStatus("同步失敗", true);
      }
    }

    function moveItem(index, direction) {
      if (index + direction < 0 || index + direction >= items.length) return;

      const sourceItem = items[index];
      const targetItem = items[index + direction];
      const sourceCat = sourceItem['類別'];
      const targetCat = targetItem['類別'];

      if (sourceCat !== targetCat) return; 

      const sourceGrid = sourceItem['編號'] || '';
      const targetGrid = targetItem['編號'] || '';

      if (sourceGrid === targetGrid) {
        [items[index], items[index + direction]] = [items[index + direction], items[index]];
      } else {
        if (sourceGrid !== '' && targetGrid !== '') {
            items.forEach(item => {
              if (item['類別'] === sourceCat) {
                if (String(item['編號']) === String(sourceGrid)) {
                  item['編號'] = targetGrid;
                  item['格子編號'] = targetGrid;
                } else if (String(item['編號']) === String(targetGrid)) {
                  item['編號'] = sourceGrid;
                  item['格子編號'] = sourceGrid;
                }
              }
            });
        } else {
            [items[index], items[index + direction]] = [items[index + direction], items[index]];
        }
      }

      items.forEach((item, idx) => item['排序'] = idx + 1);
      autoSort(); 
    }

    function autoSort() {
      items.sort((a, b) => {
        if (a['類別'] !== b['類別']) return a['類別'] === '器械' ? -1 : 1;
        const numA = parseInt(a['編號'], 10);
        const numB = parseInt(b['編號'], 10);
        
        const isNaNA = isNaN(numA);
        const isNaNB = isNaN(numB);
        
        if (isNaNA && isNaNB) return (a['排序'] || 0) - (b['排序'] || 0);
        if (isNaNA) return 1;
        if (isNaNB) return -1;
        if (numA !== numB) return numA - numB;
        
        return (a['排序'] || 0) - (b['排序'] || 0);
      });
      editingIndex = -1;
      saveData();
    }

    function renderEditor() {
      const tbody = document.getElementById('editor-tbody');
      tbody.innerHTML = '';
      items.forEach((item, index) => {
        const gridVal = item['編號'] || '';
        const tr = document.createElement('tr');
        
        if (editingIndex === index) {
          tr.className = "bg-yellow-50";
          tr.innerHTML = `
            <td class="border p-2">
              <select id="edit-cat-${index}" class="w-full p-1 border rounded text-center">
                <option value="器械" ${item['類別']==='器械'?'selected':''}>器械</option>
                <option value="其他" ${item['類別']==='其他'?'selected':''}>其他</option>
              </select>
            </td>
            <td class="border p-2"><input type="text" id="edit-grid-${index}" value="${gridVal}" class="w-full text-center p-1 border rounded"></td>
            <td class="border p-2"><input type="text" id="edit-name-${index}" value="${item['品項']}" class="w-full p-1 border rounded"></td>
            <td class="border p-2"><input type="number" id="edit-qty-${index}" value="${item['數量']}" class="w-full text-center p-1 border rounded"></td>
            <td class="border p-2">
              <div class="flex justify-center items-center gap-2">
                <button onclick="saveEdit(${index})" class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600 shadow-sm text-sm font-bold whitespace-nowrap">儲存</button>
                <button onclick="cancelEdit()" class="bg-gray-400 text-white px-3 py-1 rounded hover:bg-gray-500 shadow-sm text-sm whitespace-nowrap">取消</button>
              </div>
            </td>
          `;
        } else {
          tr.className = "hover:bg-gray-50";
          tr.innerHTML = `
            <td class="border p-2 text-center">${item['類別']}</td>
            <td class="border p-2 text-center font-bold text-blue-600">${gridVal}</td>
            <td class="border p-2">${item['品項']}</td>
            <td class="border p-2 text-center">${item['數量']}</td>
            <td class="border p-2">
              <div class="flex justify-center items-center gap-3">
                <button onclick="moveItem(${index}, -1)" class="text-gray-400 hover:text-gray-800 font-bold px-1 transition" title="上移">↑</button>
                <button onclick="moveItem(${index}, 1)" class="text-gray-400 hover:text-gray-800 font-bold px-1 transition" title="下移">↓</button>
                <button onclick="enableEdit(${index})" class="text-blue-600 hover:text-blue-800 font-bold text-sm whitespace-nowrap">編輯</button>
                <button onclick="deleteItem(${index})" class="text-red-500 hover:text-red-700 transition" title="刪除">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              </div>
            </td>
          `;
        }
        tbody.appendChild(tr);
      });
    }

    function enableEdit(index) { editingIndex = index; renderEditor(); }
    function cancelEdit() { editingIndex = -1; renderEditor(); }
    
    function saveEdit(index) {
      items[index]['類別'] = document.getElementById(`edit-cat-${index}`).value;
      const newGrid = document.getElementById(`edit-grid-${index}`).value;
      items[index]['編號'] = newGrid;
      items[index]['格子編號'] = newGrid;
      items[index]['品項'] = document.getElementById(`edit-name-${index}`).value;
      items[index]['數量'] = document.getElementById(`edit-qty-${index}`).value;
      editingIndex = -1;
      saveData();
    }
    
    function addItem() {
      const cat = document.getElementById('new-cat').value;
      const grid = document.getElementById('new-grid').value;
      const name = document.getElementById('new-name').value;
      const qty = document.getElementById('new-qty').value;
      
      if(!name) return alert('請輸入品項名稱');
      
      items.push({
        '類別': cat, 
        '排序': items.length + 1, 
        '編號': grid, 
        '格子編號': grid, 
        '品項': name, 
        '數量': qty
      });
      
      document.getElementById('new-name').value = '';
      document.getElementById('new-qty').value = '';
      saveData();
    }
    
    function deleteItem(index) { 
      if(confirm('確定要刪除此品項嗎？')) {
        items.splice(index, 1); 
        saveData(); 
      }
    }

    function generatePrint() {
      const startDateInput = document.getElementById('start-date').value;
      if(!startDateInput) return alert('請先選擇起始日期');
      
      let d = new Date(startDateInput);
      const day = d.getDay() || 7; 
      d.setDate(d.getDate() - day + 1); 

      const printArea = document.getElementById('print-area');
      printArea.innerHTML = '';

      for(let w = 0; w < selectedWeeks; w++) {
        const weekStart = new Date(d);
        weekStart.setDate(weekStart.getDate() + (w * 7));
        
        let dates = [];
        for(let i = 0; i < 5; i++) {
           let cur = new Date(weekStart);
           cur.setDate(cur.getDate() + i);
           dates.push(`${cur.getMonth() + 1}/${cur.getDate()}`);
        }

        const page = document.createElement('div');
        page.className = 'print-page';
        
        let tableHTML = `
          <table class="print-table">
            <colgroup>
              <col class="col-grid">
              <col class="col-name">
              <col class="col-qty">
              <col span="5" style="width:12.4%;">
            </colgroup>
            <thead>
              <tr>
                <th colspan="2" rowspan="2" style="font-size: 14pt;">項目</th>
                <th>日期</th>
                <th>${dates[0]}</th><th>${dates[1]}</th><th>${dates[2]}</th><th>${dates[3]}</th><th>${dates[4]}</th>
              </tr>
              <tr>
                <th>數量</th>
                <th>星期一</th><th>星期二</th><th>星期三</th><th>星期四</th><th>星期五</th>
              </tr>
            </thead>
            <tbody>
        `;

        const instruments = items.filter(i => i['類別'] === '器械');
        tableHTML += `<tr><td colspan="8" class="category-title" style="font-size: 13pt; letter-spacing: 1em;">器械</td></tr>`;
        
        let currentGrid = null;
        let gridSpan = 0;
        
        instruments.forEach((item, idx) => {
           let gridNum = item['編號'] || '';
           tableHTML += `<tr>`;
           
           if(gridNum !== currentGrid || gridNum === "") {
             gridSpan = instruments.filter(i => (i['編號'] || '') === gridNum && gridNum !== "").length;
             if(gridSpan === 0) gridSpan = 1;
             tableHTML += `<td rowspan="${gridSpan}">${gridNum}</td>`;
             currentGrid = gridNum;
           }
           
           tableHTML += `<td style="text-align: left; padding-left: 10px;">${item['品項']}</td>
                         <td>${item['數量']}</td>
                         <td></td><td></td><td></td><td></td><td></td></tr>`;
        });

        const others = items.filter(i => i['類別'] !== '器械');
        tableHTML += `<tr><td colspan="8" class="category-title" style="font-size: 13pt; letter-spacing: 1em;">其他品項</td></tr>`;
        
        others.forEach(item => {
           tableHTML += `<tr>
                          <td colspan="2" style="text-align: left; padding-left: 10px;">${item['品項']}</td>
                          <td>${item['數量']}</td>
                          <td></td><td></td><td></td><td></td><td></td>
                         </tr>`;
        });

        tableHTML += `
            <tr class="signature-row">
              <td colspan="3" style="font-size: 16pt; letter-spacing: 1em;">簽名</td>
              <td></td><td></td><td></td><td></td><td></td>
            </tr>
            </tbody>
          </table>
        `;
        page.innerHTML = tableHTML;
        printArea.appendChild(page);
      }

      setTimeout(() => { window.print(); }, 300);
    }

    window.onload = function() {
      initDate();
      loadData();
    };
  </script>
</body>
</html>
