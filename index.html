<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>治療室點班單</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 螢幕顯示模式：隱藏列印區 */
    @media screen {
      #print-area { display: none; }
    }
    
    /* 列印模式 */
    @media print {
      body { background-color: white; padding: 0; margin: 0; }
      #ui-area { display: none !important; }
      #print-area { display: block; width: 100%; }
      
      /* 強制消除預設邊界，由下方的 print-page 接管精準排版 */
      @page { size: A4; margin: 0mm !important; } 
      
      /* 單頁容器：絕對鎖死高度，防止超出產生空白頁 */
      .print-page {
        width: 210mm;
        height: 296mm; /* A4高度297mm，微調至296mm防止1px溢出換頁 */
        box-sizing: border-box;
        position: relative; 
        page-break-after: always;
        page-break-inside: avoid;
        overflow: hidden; /* 終極防破版：隱藏任何微小的溢出 */
      }
      
      /* 最後一頁取消強制換頁，消滅最後的空白頁 */
      .print-page.last-page {
        page-break-after: auto; 
      }

      /* 雙面列印對稱邊界設定 (奇數頁左邊留2cm，偶數頁右邊留2cm) */
      .page-odd { padding: 10mm 10mm 10mm 20mm; }
      .page-even { padding: 10mm 20mm 10mm 10mm; }

      /* ✨ 專屬打洞對齊小三角形 (僅首頁會有) */
      .punch-mark {
        position: absolute;
        top: 50%; 
        transform: translateY(-50%);
        width: 0; 
        height: 0;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
      }
      /* 奇數頁(第一頁)在左側，畫一個向右指的淡灰三角形 */
      .page-odd .punch-mark {
        left: 4mm; 
        border-left: 7px solid #9ca3af; 
      }
      
      .print-table { 
        width: 100%; 
        height: 100%; 
        border-collapse: collapse; 
        table-layout: fixed; 
        font-size: 12pt; 
      }
      
      .print-table th, .print-table td { 
        border: 1px solid black; 
        text-align: center; 
        padding: 1px; 
      }
      
      .print-table th { background-color: #f9fafb; font-weight: normal; }
      .print-table thead th { height: 35px; }
      .category-title { height: 35px; }
      
      .col-grid { width: 8%; }
      .col-name { width: 18%; }
      .col-qty { width: 12%; }
      
      /* 簽名欄：高度縮小至55px，文字垂直置中 */
      .signature-row td { height: 55px; vertical-align: middle; padding-bottom: 0;}
    }
  </style>
</head>
<body class="bg-gray-100 p-6">

  <!-- ================= 操作介面區 ================= -->
  <div id="ui-area" class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
    
    <div class="flex items-center gap-4 mb-6">
      <h1 class="text-3xl font-bold text-gray-800">治療室點班單系統</h1>
    </div>
    
    <div class="flex flex-wrap gap-6 items-end mb-8 bg-gray-50 p-5 rounded border">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-gray-700 leading-none">起始日期 (週一)</label>
        <input type="date" id="start-date" onchange="checkMonday()" class="border border-gray-300 px-3 rounded h-[38px] w-40 box-border text-sm">
      </div>
      
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-gray-700 leading-none">列印週數</label>
        <div class="flex gap-2 items-center h-[38px]" id="week-pills">
          <button onclick="setWeeks(2)" class="week-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 h-[30px] rounded-full text-sm font-medium transition flex items-center justify-center">2週</button>
          <button onclick="setWeeks(4)" class="week-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 h-[30px] rounded-full text-sm font-medium transition flex items-center justify-center">4週</button>
          <button onclick="setWeeks(6)" class="week-btn bg-blue-600 text-white px-4 h-[30px] rounded-full text-sm font-medium transition flex items-center justify-center shadow-sm" data-active="true">6週</button>
          <button onclick="setWeeks(8)" class="week-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 h-[30px] rounded-full text-sm font-medium transition flex items-center justify-center">8週</button>
        </div>
      </div>

      <div class="ml-auto flex gap-3">
        <button onclick="loadData()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold px-4 h-[38px] rounded transition shadow text-sm">
          重新載入
        </button>
        <button onclick="generatePrint()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 h-[38px] rounded transition shadow text-sm">
          列印
        </button>
      </div>
    </div>

    <div class="flex items-end gap-4 mb-4 max-w-3xl mx-auto">
      <h2 class="text-xl font-bold text-gray-800">資料編輯區</h2>
      <span id="status-msg" class="text-sm font-medium text-gray-600 bg-gray-100 border px-3 py-1 rounded-full border-transparent">載入中...</span>
    </div>

    <!-- 縮減表格最大寬度為 max-w-3xl，讓品項名稱與數量靠近 -->
    <div class="overflow-x-auto max-w-3xl mx-auto">
      <table class="w-full border-collapse border border-gray-300 text-sm">
        <thead class="bg-gray-200">
          <tr>
            <th class="border p-2 w-24">類別</th>
            <th class="border p-2 w-20">編號</th>
            <th class="border p-2">品項名稱</th>
            <th class="border p-2 w-24">數量</th>
            <th class="border p-2 w-40">操作</th>
          </tr>
        </thead>
        <tbody id="editor-tbody">
          <!-- 資料由 JS 動態產生 -->
        </tbody>
        <tfoot class="bg-gray-100 border-t-2 border-gray-300">
          <tr>
            <td class="border p-2">
              <select id="new-cat" onchange="handleCatChange()" class="w-full p-2 border rounded text-center font-bold text-gray-700">
                <option value="器械">器械</option>
                <option value="其他品項">其他品項</option>
              </select>
            </td>
            <td class="border p-2">
              <input type="text" id="new-grid" class="w-full p-2 border rounded text-center font-bold text-blue-600" placeholder="如: 1">
            </td>
            <td class="border p-2">
              <input type="text" id="new-name" class="w-full p-2 border rounded" placeholder="輸入品項名稱">
            </td>
            <td class="border p-2">
              <input type="number" id="new-qty" class="w-full p-2 border rounded text-center" placeholder="數量">
            </td>
            <td class="border p-2">
              <!-- 新增與排序按鈕並列 -->
              <div class="flex justify-center items-center gap-2">
                <button onclick="addItem()" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600 transition shadow-sm font-bold w-full whitespace-nowrap">新增</button>
                <button onclick="autoSort()" class="bg-blue-50 text-blue-600 hover:bg-blue-100 border border-blue-200 font-bold px-3 py-2 rounded transition shadow-sm whitespace-nowrap" title="依類別與編號自動排序">
                  ✨ 排序
                </button>
              </div>
            </td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <!-- ================= 列印隱藏區 ================= -->
  <div id="print-area"></div>

  <!-- ================= 核心邏輯 ================= -->
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzwGKX1VXJY1EaWulhxdKUB-NUnIR1oSJwHa2xQFezah8-QkpUABkOIWpq6xsx4Tic_/exec';
    let items = [];
    let selectedWeeks = 6; 
    let editingIndex = -1;

    function initDate() {
      const d = new Date();
      const day = d.getDay() || 7; 
      d.setDate(d.getDate() - day + 1); 
      
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      document.getElementById('start-date').value = `${yyyy}-${mm}-${dd}`;
    }

    function checkMonday() {
      const input = document.getElementById('start-date');
      if (!input.value) return;
      
      let d = new Date(input.value);
      const day = d.getDay();
      
      if (day !== 1) {
        alert("起始日期必須是星期一！系統已自動為您校正。");
        const dayCalc = day || 7; 
        d.setDate(d.getDate() - dayCalc + 1); 
        
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        input.value = `${yyyy}-${mm}-${dd}`;
      }
    }

    function setWeeks(weeks) {
      selectedWeeks = weeks;
      const btns = document.querySelectorAll('.week-btn');
      btns.forEach(btn => {
        if (btn.innerText.includes(weeks)) {
          btn.className = "week-btn bg-blue-600 text-white px-4 h-[30px] rounded-full text-sm font-medium transition flex items-center justify-center shadow-sm";
        } else {
          btn.className = "week-btn bg-gray-200 text-gray-700 hover:bg-gray-300 px-4 h-[30px] rounded-full text-sm font-medium transition flex items-center justify-center";
        }
      });
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById('status-msg');
      el.innerText = msg;
      if(isError) {
        el.className = "text-sm font-medium text-red-600 bg-red-50 border px-3 py-1 rounded-full border-red-200";
      } else if (msg === '已同步') {
        el.className = "text-sm font-medium text-green-700 bg-green-50 border px-3 py-1 rounded-full border-green-200";
      } else {
        el.className = "text-sm font-medium text-gray-600 bg-gray-100 border px-3 py-1 rounded-full border-transparent";
      }
    }

    function handleCatChange() {
      const cat = document.getElementById('new-cat').value;
      const gridInp = document.getElementById('new-grid');
      if(cat === '其他品項') {
        gridInp.value = '';
        gridInp.disabled = true;
        gridInp.classList.add('bg-gray-200');
        gridInp.placeholder = '-';
      } else {
        gridInp.disabled = false;
        gridInp.classList.remove('bg-gray-200');
        gridInp.placeholder = '如: 1';
        
        let maxGrid = 0;
        items.filter(i => i['類別'] === '器械').forEach(i => {
          let g = parseInt(i['編號']);
          if(!isNaN(g) && g > maxGrid) maxGrid = g;
        });
        gridInp.value = maxGrid + 1;
      }
    }

    async function loadData() {
      setStatus("載入中...");
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        items = data.map(item => {
          if(item['類別'] === '其他') item['類別'] = '其他品項';
          let val = item['編號'] !== undefined ? item['編號'] : (item['格子編號'] || '');
          item['編號'] = val;
          item['格子編號'] = val;
          return item;
        }).sort((a, b) => parseInt(a['排序'] || 0) - parseInt(b['排序'] || 0));
        
        editingIndex = -1;
        renderEditor();
        handleCatChange(); 
        setStatus("已同步");
      } catch (error) {
        console.error(error);
        setStatus("同步失敗", true);
      }
    }

    async function saveData() {
      setStatus("儲存中...");
      items.forEach((item, index) => item['排序'] = index + 1);
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(items)
        });
        setStatus("已同步");
        renderEditor();
        handleCatChange(); 
      } catch (error) {
        console.error(error);
        setStatus("同步失敗", true);
      }
    }

    function moveItem(index, direction) {
      if (index + direction < 0 || index + direction >= items.length) return;

      const sourceItem = items[index];
      const targetItem = items[index + direction];
      const sourceCat = sourceItem['類別'];
      const targetCat = targetItem['類別'];

      if (sourceCat !== targetCat) return; 

      const sourceGrid = sourceItem['編號'] || '';
      const targetGrid = targetItem['編號'] || '';

      if (sourceGrid === targetGrid) {
        [items[index], items[index + direction]] = [items[index + direction], items[index]];
      } else {
        if (sourceGrid !== '' && targetGrid !== '') {
            items.forEach(item => {
              if (item['類別'] === sourceCat) {
                if (String(item['編號']) === String(sourceGrid)) {
                  item['編號'] = targetGrid;
                  item['格子編號'] = targetGrid;
                } else if (String(item['編號']) === String(targetGrid)) {
                  item['編號'] = sourceGrid;
                  item['格子編號'] = sourceGrid;
                }
              }
            });
        } else {
            [items[index], items[index + direction]] = [items[index + direction], items[index]];
        }
      }

      items.forEach((item, idx) => item['排序'] = idx + 1);
      autoSort(); 
    }

    function autoSort() {
      items.sort((a, b) => {
        if (a['類別'] !== b['類別']) return a['類別'] === '器械' ? -1 : 1;
        const numA = parseInt(a['編號'], 10);
        const numB = parseInt(b['編號'], 10);
        
        const isNaNA = isNaN(numA);
        const isNaNB = isNaN(numB);
        
        if (isNaNA && isNaNB) return (a['排序'] || 0) - (b['排序'] || 0);
        if (isNaNA) return 1;
        if (isNaNB) return -1;
        if (numA !== numB) return numA - numB;
        
        return (a['排序'] || 0) - (b['排序'] || 0);
      });
      editingIndex = -1;
      saveData();
    }

    function renderEditor() {
      const tbody = document.getElementById('editor-tbody');
      tbody.innerHTML = '';
      items.forEach((item, index) => {
        const gridVal = item['編號'] || '';
        const tr = document.createElement('tr');
        
        if (editingIndex === index) {
          tr.className = "bg-yellow-50";
          tr.innerHTML = `
            <td class="border p-2">
              <select id="edit-cat-${index}" class="w-full p-1 border rounded text-center text-sm">
                <option value="器械" ${item['類別']==='器械'?'selected':''}>器械</option>
                <option value="其他品項" ${item['類別']==='其他品項'?'selected':''}>其他品項</option>
              </select>
            </td>
            <td class="border p-2"><input type="text" id="edit-grid-${index}" value="${gridVal}" class="w-full text-center p-1 border rounded"></td>
            <td class="border p-2"><input type="text" id="edit-name-${index}" value="${item['品項']}" class="w-full p-1 border rounded"></td>
            <td class="border p-2"><input type="number" id="edit-qty-${index}" value="${item['數量']}" class="w-full text-center p-1 border rounded"></td>
            <td class="border p-2">
              <div class="flex justify-center items-center gap-2">
                <button onclick="saveEdit(${index})" class="bg-green-500 text-white px-3 py-1.5 rounded hover:bg-green-600 shadow-sm text-sm font-bold whitespace-nowrap">儲存</button>
                <button onclick="cancelEdit()" class="bg-gray-400 text-white px-3 py-1.5 rounded hover:bg-gray-500 shadow-sm text-sm whitespace-nowrap">取消</button>
              </div>
            </td>
          `;
        } else {
          tr.className = "hover:bg-gray-50";
          tr.innerHTML = `
            <td class="border p-2 text-center text-gray-700">${item['類別']}</td>
            <td class="border p-2 text-center font-bold text-blue-600">${gridVal}</td>
            <td class="border p-2">${item['品項']}</td>
            <td class="border p-2 text-center text-lg">${item['數量']}</td>
            <td class="border p-2">
              <div class="flex justify-center items-center gap-3">
                <!-- 全新 V 型箭頭圖示 (上移) -->
                <button onclick="moveItem(${index}, -1)" class="text-gray-400 hover:text-indigo-600 transition p-1" title="上移">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7" /></svg>
                </button>
                <!-- 全新 V 型箭頭圖示 (下移) -->
                <button onclick="moveItem(${index}, 1)" class="text-gray-400 hover:text-indigo-600 transition p-1" title="下移">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" /></svg>
                </button>
                
                <!-- 筆圖示 (編輯) -->
                <button onclick="enableEdit(${index})" class="text-blue-500 hover:text-blue-700 transition p-1 ml-1" title="編輯">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                </button>

                <!-- 垃圾桶 (刪除) -->
                <button onclick="deleteItem(${index})" class="text-red-400 hover:text-red-600 transition p-1" title="刪除">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </td>
          `;
        }
        tbody.appendChild(tr);
      });
    }

    function enableEdit(index) { editingIndex = index; renderEditor(); }
    function cancelEdit() { editingIndex = -1; renderEditor(); }
    
    function saveEdit(index) {
      items[index]['類別'] = document.getElementById(`edit-cat-${index}`).value;
      const newGrid = document.getElementById(`edit-grid-${index}`).value;
      items[index]['編號'] = newGrid;
      items[index]['格子編號'] = newGrid;
      items[index]['品項'] = document.getElementById(`edit-name-${index}`).value;
      items[index]['數量'] = document.getElementById(`edit-qty-${index}`).value;
      editingIndex = -1;
      saveData();
    }
    
    function addItem() {
      const cat = document.getElementById('new-cat').value;
      const grid = document.getElementById('new-grid').value;
      const name = document.getElementById('new-name').value;
      const qty = document.getElementById('new-qty').value;
      
      if(!name) return alert('請輸入品項名稱');
      
      items.push({
        '類別': cat, 
        '排序': items.length + 1, 
        '編號': grid, 
        '格子編號': grid, 
        '品項': name, 
        '數量': qty
      });
      
      document.getElementById('new-name').value = '';
      document.getElementById('new-qty').value = '';
      saveData();
    }
    
    function deleteItem(index) { 
      if(confirm('確定要刪除此品項嗎？')) {
        items.splice(index, 1); 
        saveData(); 
      }
    }

    function generatePrint() {
      const startDateInput = document.getElementById('start-date').value;
      if(!startDateInput) return alert('請先選擇起始日期');
      
      let d = new Date(startDateInput);
      const day = d.getDay() || 7; 
      d.setDate(d.getDate() - day + 1); 

      const printArea = document.getElementById('print-area');
      printArea.innerHTML = '';

      for(let w = 0; w < selectedWeeks; w++) {
        const weekStart = new Date(d);
        weekStart.setDate(weekStart.getDate() + (w * 7));
        
        let dates = [];
        for(let i = 0; i < 5; i++) {
           let cur = new Date(weekStart);
           cur.setDate(cur.getDate() + i);
           dates.push(`${cur.getMonth() + 1}/${cur.getDate()}`);
        }

        const page = document.createElement('div');
        
        // 判斷奇數偶數頁 (w從0開始，0為第一頁奇數，1為偶數)
        const isOddPage = (w % 2 === 0);
        page.className = 'print-page ' + (isOddPage ? 'page-odd' : 'page-even');
        
        // 若為最後一頁，加上 last-page class 避免多印一張空白
        if (w === selectedWeeks - 1) {
          page.classList.add('last-page');
        }
        
        // 僅在第一頁加入打洞器三角形標記
        if (w === 0) {
          const punchHole = document.createElement('div');
          punchHole.className = 'punch-mark';
          page.appendChild(punchHole);
        }
        
        let tableHTML = `
          <table class="print-table">
            <colgroup>
              <col class="col-grid">
              <col class="col-name">
              <col class="col-qty">
              <col span="5" style="width:12.4%;">
            </colgroup>
            <thead>
              <tr>
                <th colspan="2" rowspan="2" style="font-size: 14pt;">項目</th>
                <th>日期</th>
                <th>${dates[0]}</th><th>${dates[1]}</th><th>${dates[2]}</th><th>${dates[3]}</th><th>${dates[4]}</th>
              </tr>
              <tr>
                <th>數量</th>
                <th>星期一</th><th>星期二</th><th>星期三</th><th>星期四</th><th>星期五</th>
              </tr>
            </thead>
            <tbody>
        `;

        const instruments = items.filter(i => i['類別'] === '器械');
        tableHTML += `<tr><td colspan="8" class="category-title" style="font-size: 13pt; letter-spacing: 1em;">器械</td></tr>`;
        
        let currentGrid = null;
        let gridSpan = 0;
        
        instruments.forEach((item, idx) => {
           let gridNum = item['編號'] || '';
           tableHTML += `<tr>`;
           
           if(gridNum !== currentGrid || gridNum === "") {
             gridSpan = instruments.filter(i => (i['編號'] || '') === gridNum && gridNum !== "").length;
             if(gridSpan === 0) gridSpan = 1;
             tableHTML += `<td rowspan="${gridSpan}">${gridNum}</td>`;
             currentGrid = gridNum;
           }
           
           tableHTML += `<td style="text-align: left; padding-left: 10px;">${item['品項']}</td>
                         <td>${item['數量']}</td>
                         <td></td><td></td><td></td><td></td><td></td></tr>`;
        });

        const others = items.filter(i => i['類別'] === '其他品項' || i['類別'] === '其他');
        tableHTML += `<tr><td colspan="8" class="category-title" style="font-size: 13pt; letter-spacing: 1em;">其他品項</td></tr>`;
        
        others.forEach(item => {
           tableHTML += `<tr>
                          <td colspan="2" style="text-align: left; padding-left: 10px;">${item['品項']}</td>
                          <td>${item['數量']}</td>
                          <td></td><td></td><td></td><td></td><td></td>
                         </tr>`;
        });

        tableHTML += `
            <tr class="signature-row">
              <td colspan="3" style="font-size: 16pt; letter-spacing: 1em;">簽名</td>
              <td></td><td></td><td></td><td></td><td></td>
            </tr>
            </tbody>
          </table>
        `;
        page.innerHTML += tableHTML;
        printArea.appendChild(page);
      }

      setTimeout(() => { window.print(); }, 300);
    }

    window.onload = function() {
      initDate();
      loadData();
    };
  </script>
</body>
</html>
